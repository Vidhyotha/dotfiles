## Auto-connect A2DP playback/capture profiles on Bluetooth devices only.
## Keeps headsets in A2DP on (re)connect instead of letting WirePlumber
## spontaneously flip them into HFP/HSP and churn transports. HFP still
## engages on demand when an app actually opens the mic. (mirrors omarchy)
monitor.bluez.rules = [
  {
    matches = [
      {
        device.name = "~bluez_card.*"
      }
    ]
    actions = {
      update-props = {
        bluez5.auto-connect = [ a2dp_sink a2dp_source ]
      }
    }
  }
]
